# ===== Data Layer config (Trung) =====
# Tham số RIÊNG của Data Layer. KHÔNG sao chép từ config/generator.yaml:
# Generator là "thế giới", Data Layer chỉ được biết những gì nhà máy thật biết.

day_start: "06:00"        # đầu ngày làm việc = mốc t_min = 0 (lịch vận hành nhà máy)
tz_offset_hours: 7        # múi giờ nhà máy (+07:00) cho mọi timestamp xuất ra

origin_id: STORE-1        # v0.1 chỉ có 1 kho -> origin_id cố định của mọi MaterialRequest

resources_total:          # sổ đăng ký thiết bị của nhà máy (số đơn vị đang sở hữu)
  amr: 6
  packer: 3               # số vị trí đóng gói tại cổng
  agv: 4

fallback_estimates:       # (phút) dùng khi chưa đủ dữ liệu để tự học; lấy từ sổ tay vận hành
  amr_travel: 4.0         # AMR kho -> cổng
  pack_setup: 1.5         # nhận thùng, chuẩn bị đóng gói
  pack_per_unit: 1.0      # thời gian tách 1 pack
  agv_travel: 3.0         # AGV cổng -> line
  agv_return: 2.5         # AGV line -> cổng; feed AGV không có sự kiện "về", nên chỉ dùng giá trị này

min_remaining_min: 0.5    # contract yêu cầu remaining_min > 0; job quá hạn dự kiến vẫn còn ít nhất bấy nhiêu phút
estimate_min_samples: 10  # cần ít nhất bấy nhiêu mẫu đã quan sát mới tin ước lượng học từ dữ liệu
